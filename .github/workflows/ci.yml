name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Drift's NativeDatabase in unit tests loads the host's libsqlite3.so.
      - name: Install SQLite
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^14

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Run Firestore Rules Emulator Tests
        run: firebase emulators:exec "python3 test/rules_v2_emulator_test.py" --only firestore --project trip-planner-2775c
